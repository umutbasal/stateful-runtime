[package]
name = "stateful-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["json", "macros"] }
capnp = "0.25.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
dashmap = "6.1.0"
deno_core = "0.385.0"
deno_error = "0.7.3"
futures = "0.3.31"
http = "1.3.1"
parking_lot = "0.12.5"
prometheus = "0.14.0"
rdkafka = { version = "0.38.0", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
