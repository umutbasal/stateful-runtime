app:
  name: x-timeline
  version: 0.1.0

limits:
  max_concurrent_requests: 1500
  max_request_bytes: 1048576
  max_response_bytes: 1048576
  rate_limits:
    query_rps: 15000
    ingest_rps: 25000
  js:
    pool_size: 6
    memory_limit_bytes: 134217728
    max_cpu_ms_per_request: 5
  store:
    max_bytes: 2147483648
    max_entity_bytes: 65536
    tombstone_ttl_seconds: 3600
    soft_limit_percent: 85

formats:
  kafka:
    encoding: json
  http:
    request: json
    response: json

ingestion:
  - type: kafka
    group_id: x-timeline-runtime
    topics:
      - name: tweet-events
        entity: post
        event_type: tweet_event

queries:
  - name: get_feed
    handler: scripts/queries/get_feed.js

crons:
  - name: trim_user_timeline
    interval_seconds: 300
    handler: scripts/crons/trim.js

lifecycle:
  on_init: scripts/on_init.js

endpoints:
  - name: feed
    method: GET
    path: /v1/feed
    handler: scripts/routes/feed.js
  - name: user_timeline
    method: GET
    path: /v1/users/:id/timeline
    handler: scripts/routes/user_timeline.js

admin:
  enable_grpc: false
  enable_execute: false
