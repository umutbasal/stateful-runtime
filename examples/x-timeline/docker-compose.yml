name: x-timeline

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.16
    command:
      - redpanda
      - start
      - --check=false
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-init:
    image: redpandadata/redpanda:v24.2.16
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/bin/sh", "-c", "rpk topic create tweet-events --if-not-exists --brokers redpanda:9092"]
    restart: "no"

  runtime:
    build:
      context: ../..
      dockerfile: examples/x-timeline/Dockerfile.runtime
    environment:
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: info
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  fake-ingest:
    image: redpandadata/redpanda:v24.2.16
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      runtime:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: tweet-events
      INGEST_INTERVAL_SECONDS: "0.3"
    volumes:
      - ./scripts/fake_ingest.sh:/scripts/fake_ingest.sh:ro
    command: ["/bin/sh", "/scripts/fake_ingest.sh"]
