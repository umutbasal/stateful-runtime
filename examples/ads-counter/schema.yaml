entities:
  - name: campaign_stats
    primary_key: campaign_id
    fields:
      - name: campaign_id
        type: string
        required: true
      - name: impressions
        type: number
      - name: clicks
        type: number
      - name: conversions
        type: number
      - name: updated_at
        type: string
    indexes:
      - name: by_campaign
        field: campaign_id
        type: hash
      - name: by_updated_at
        field: updated_at
        type: sorted
    retention:
      ttl_seconds: 86400
